services:
  postgres:
    image: "postgres:latest"
    environment:
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_USER=${POSTGRES_USER}"
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:

networks:
  default:
    name: week1_network
